[build]
  command = "npm cache clean --force && rm -rf .next node_modules/.cache node_modules package-lock.json && npm install --legacy-peer-deps --verbose && npm run build"

[build.environment]
  # Use Node.js 18 for better compatibility with React 18
  NODE_VERSION = "18"
  # Disable telemetry for faster builds
  NEXT_TELEMETRY_DISABLED = "1"
  # Enable verbose logging
  CI = "true"
  # Skip husky hooks during CI
  HUSKY = "0"
  # Use legacy peer deps to avoid conflicts
  NPM_FLAGS = "--legacy-peer-deps"
  # Force clean install
  NETLIFY_USE_YARN = "false"
  # Ensure proper module resolution
  NPM_CONFIG_LEGACY_PEER_DEPS = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"

[[headers]]
  for = "/*"
  [headers.values]
    # Content Security Policy - Allow unsafe-eval for Supabase and Next.js
    Content-Security-Policy = "default-src 'self'; script-src 'self' 'unsafe-eval' 'unsafe-inline' https://va.vercel-scripts.com https://*.supabase.co; style-src 'self' 'unsafe-inline'; img-src 'self' blob: data: https:; font-src 'self' data:; connect-src 'self' https://*.supabase.co https://*.supabase.in wss://*.supabase.co wss://*.supabase.in https://*.supabase.net; frame-src 'self' https://js.stripe.com; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; block-all-mixed-content; upgrade-insecure-requests;"
    # Security headers
    X-Frame-Options = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    Permissions-Policy = "camera=(), microphone=(), geolocation=()"

# Netlify Functions configuration
[functions]
  directory = ".netlify/functions"
  node_bundler = "esbuild"
