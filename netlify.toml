[build]
  command = "npm run build"
  publish = ".next"

[build.environment]
  # Use Node.js 18 for better compatibility with React 18
  NODE_VERSION = "18"
  # Disable telemetry for faster builds
  NEXT_TELEMETRY_DISABLED = "1"

[[plugins]]
  package = "@netlify/plugin-nextjs"

# Simple redirect for all routes to Next.js handler
[[redirects]]
  from = "/*"
  to = "/.netlify/functions/___netlify-handler"
  status = 200
